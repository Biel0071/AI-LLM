version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_platform_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiplatform_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-aiplatform}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiplatform"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai_platform_redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: ai_platform_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-aiplatform}:${POSTGRES_PASSWORD:-aiplatform_secret_pass}@postgres:5432/${POSTGRES_DB:-aiplatform}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-aiplatform_prod_jwt_secret}
    ports:
      - "${API_PORT_HOST:-3001}:3000"

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    container_name: ai_platform_worker
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-aiplatform}:${POSTGRES_PASSWORD:-aiplatform_secret_pass}@postgres:5432/${POSTGRES_DB:-aiplatform}?schema=public
      REDIS_URL: redis://redis:6379

  nginx:
    image: nginx:alpine
    container_name: ai_platform_nginx
    restart: always
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  postgres_data:
  redis_data:
